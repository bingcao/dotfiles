set-option -g history-limit 25000
set -g mouse on

# for neovim
set -sg escape-time 10

# vi for copy mode
setw -g mode-keys vi

# key bindings for swapping windows
bind-key C-h swap-window -t -1\; select-window -t -1
bind-key C-l swap-window -t +1\; select-window -t +1

# clear history
bind-key C-k send-keys -R ^M \; clear-history

# count the panes from 1
set -g base-index 1
setw -g pane-base-index 1

# renumber windows when window is closed
set -g renumber-windows on

# overrides for split
bind-key v split-window -v -c "#{pane_current_path}"
bind-key s split-window -h -c "#{pane_current_path}"

# rename window
bind-key r command-prompt "rename-window %%"

# reload configuration
bind-key R source-file ~/.tmux.conf

# term colors, these are the correct ones according to neovim checkhealth
set-option -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'

# Styling
set -g @dracula-show-powerline true
set -g @dracula-fixed-location "San Francisco"
set -g @dracula-plugins "weather"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-cpu-display-load true
set -g status-position top

set -g update-environment "SSH_AUTH_SOCK"

# Navigate between vim and tmux
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
